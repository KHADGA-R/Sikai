server:
  port: ${PORT:8080}
  error:
    include-message: never
spring:
  application:
    name: sikai-backend
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/sikai;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 101MB
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
management:
  health.mail.enabled: ${EMAIL_ENABLED:false}
  endpoints.web.exposure.include: health
  endpoint.health.show-details: never
sikai:
  cors-origins: ${CORS_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
  token-hours: ${TOKEN_HOURS:24}
  upload-directory: ${UPLOAD_DIRECTORY:./uploads}
  email-enabled: ${EMAIL_ENABLED:false}
  email-from: ${EMAIL_FROM:no-reply@sikai.local}
  admin-email: ${ADMIN_EMAIL:}
  admin-password: ${ADMIN_PASSWORD:}
