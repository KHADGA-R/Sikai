services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: sikai
      POSTGRES_USER: sikai
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment or .env}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sikai -d sikai"]
      interval: 5s
      timeout: 5s
      retries: 15
  backend:
    build: .
    ports: ["8080:8080"]
    environment:
      DB_URL: jdbc:postgresql://db:5432/sikai
      DB_USERNAME: sikai
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200}
    volumes:
      - media:/app/uploads
    depends_on:
      db:
        condition: service_healthy
volumes:
  database:
  media:
